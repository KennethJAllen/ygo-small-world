name: Update card data

on:
  schedule:
    - cron: '17 6 1 * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-card-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Update card data
        run: uv run --locked update

      - name: Run tests
        run: uv run --locked pytest -q

      - name: Commit and push changed card data
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git add -- data/cardinfo.csv
          if git diff --cached --quiet -- data/cardinfo.csv; then
            echo "Card data is unchanged."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Update card data"
          git push origin "HEAD:refs/heads/$DEFAULT_BRANCH"
